[package]
name = "market-information-capacity"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Simulation and validation of how finite independent information constrains market price informativeness as trader participation grows"
license = "MIT"
readme = "README.md"
repository = "https://github.com/egpivo/market-information-capacity"
keywords = ["simulation", "monte-carlo", "market-microstructure", "information"]
categories = ["science", "simulation"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
