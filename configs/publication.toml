# Canonical publication-scale configuration for market-information-capacity.
#
# This file is the machine-readable statement of every canonical experiment.
# It is byte-for-byte equivalent to `Config::publication()` in src/config.rs;
# tests/config_contract.rs enforces that equivalence, so editing one without
# the other fails the build.
#
# Any section may be omitted, in which case the canonical value is used.
# `configs/quick.toml` is the same experiment set at reduced Monte Carlo scale.

